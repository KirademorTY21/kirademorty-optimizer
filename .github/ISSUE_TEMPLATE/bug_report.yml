name: Bug report
description: Something in KiraDemorTY Optimizer does not work as described
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** paste personal data.
        The HTML report generated by the app does **not** contain your computer name, so it is
        safe to attach — but check it before uploading.

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the sidebar and in Settings.
      placeholder: v1.2
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: Run `winver` and copy the version and build number.
      placeholder: Windows 10 Pro 22H2, build 19045.xxxx
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: CPU / GPU / RAM
      placeholder: Ryzen 5 3600 / RTX 2060 SUPER / 16 GB
    validations:
      required: true

  - type: dropdown
    id: admin
    attributes:
      label: Was the app running as Administrator?
      description: The badge in the top-right corner says Administrator or Limited mode.
      options:
        - "Yes — badge shows Administrator"
        - "No — badge shows Limited mode"
        - "I am not sure"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Tweaks page
        2. Press "Apply recommended"
        3. Restart
        4. Open Diagnostics and press "Re-scan"
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: HTML report (optional)
      description: Report page → Generate report, then drag the HTML file here. It contains no computer name.
      placeholder: Drag the .html file into this box.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, the undo script, exact error text.

  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I am using the latest release from the Releases page.
          required: true
        - label: I understand the executable is unsigned, so SmartScreen may warn on first launch.
          required: true
